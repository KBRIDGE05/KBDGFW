name: Update air cargo FSC

on:
  workflow_dispatch:
  schedule:
    # 1st and 16th, 10:10 KST = 01:10 UTC.
    - cron: "10 1 1,16 * *"

permissions:
  contents: write

concurrency:
  group: update-air-fsc
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Read airline FSC official pages
        run: python scripts/update_freight_data.py --only fsc
      - name: Commit only when data changed
        shell: bash
        run: |
          if git diff --quiet -- data/freight-data.json; then
            echo "No new FSC values published."
            exit 0
          fi
          git config user.name "kbridge-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/freight-data.json
          git commit -m "data: update air cargo FSC"
          git push
