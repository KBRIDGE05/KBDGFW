name: Update Korean Air Cargo FSC

on:
  workflow_dispatch:
  schedule:
    # Daily 11:10 KST. Korean Air monthly notices can be posted a few days after month start,
    # so a daily lightweight check is safer than fixed 1st/16th-only runs.
    - cron: "10 2 * * *"

permissions:
  contents: write

concurrency:
  group: freight-data-writer
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Read latest Korean Air Cargo FSC notice
        run: python scripts/update_freight_data.py --only fsc
      - name: Commit only when data changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- data/freight-data.json; then
            echo "No new Korean Air FSC value or source-status change."
            exit 0
          fi
          git config user.name "kbridge-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/freight-data.json
          git commit -m "data: update Korean Air cargo FSC"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
