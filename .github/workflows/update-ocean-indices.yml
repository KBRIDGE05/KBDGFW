name: Update SCFI and KCCI

on:
  workflow_dispatch:
  schedule:
    # KCCI: Monday 15:30 KST = 06:30 UTC.
    - cron: "30 6 * * 1"
    # SCFI: Friday 17:30 KST = 08:30 UTC (16:30 Beijing, after 15:00 release).
    - cron: "30 8 * * 5"

permissions:
  contents: write

concurrency:
  group: update-ocean-indices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Update the scheduled official source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            python scripts/update_freight_data.py --only ocean
          elif [[ "$EVENT_SCHEDULE" == "30 8 * * 5" ]]; then
            python scripts/update_freight_data.py --only scfi
          elif [[ "$EVENT_SCHEDULE" == "30 6 * * 1" ]]; then
            python scripts/update_freight_data.py --only kcci
          else
            echo "Unknown schedule: $EVENT_SCHEDULE" >&2
            exit 2
          fi

      - name: Commit only when data changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- data/freight-data.json; then
            echo "No new ocean-index values or source-status changes."
            exit 0
          fi
          git config user.name "kbridge-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/freight-data.json
          git commit -m "data: update official ocean indices"
          git push
