name: Blog Style Guard
on:
  push:
    paths:
      - 'blog/**'
      - 'assets/css/pages/blog-*.css'
      - 'assets/blog-style-lock.js'
      - 'tools/validate-blog-style.py'
  pull_request:
    paths:
      - 'blog/**'
      - 'assets/css/pages/blog-*.css'
      - 'assets/blog-style-lock.js'
      - 'tools/validate-blog-style.py'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate blog CSS policy
        run: python tools/validate-blog-style.py
