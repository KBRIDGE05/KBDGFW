name: KBRIDGE Blog SEO Automation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'blog/posts/**/*.html'
      - 'scripts/build-blog-posts.mjs'
      - '.github/workflows/update-blog-posts.yml'

permissions:
  contents: write

concurrency:
  group: kbridge-blog-seo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-blog-seo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Detect changed blog posts
        shell: bash
        run: |
          : > /tmp/changed-blog-posts.txt
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            touch /tmp/notify-all-blog-posts
            echo "Manual run: all current blog posts will be notified."
            exit 0
          fi

          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            git ls-files 'blog/posts/**/*.html' > /tmp/changed-blog-posts.txt
          else
            git diff --name-only "$BEFORE" "$AFTER" -- 'blog/posts/**/*.html' > /tmp/changed-blog-posts.txt
          fi
          echo "Changed blog posts:"
          cat /tmp/changed-blog-posts.txt || true

      - name: Generate manifest, sitemap and RSS
        run: node scripts/build-blog-posts.mjs

      - name: Commit generated SEO files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/blog-posts.json sitemap.xml rss.xml 736f09a19bf4a21e9a05a8bfe60a60c4.txt

          if git diff --cached --quiet; then
            echo "No generated SEO file changes."
          else
            git commit -m "Update blog manifest, sitemap and RSS"
            git push
          fi

      - name: Wait for GitHub Pages deployment
        run: sleep 75

      - name: Notify Naver IndexNow
        shell: bash
        run: |
          if [ -f /tmp/notify-all-blog-posts ]; then
            node scripts/build-blog-posts.mjs --notify-all
          elif [ -s /tmp/changed-blog-posts.txt ]; then
            mapfile -t CHANGED_FILES < /tmp/changed-blog-posts.txt
            node scripts/build-blog-posts.mjs --notify "${CHANGED_FILES[@]}"
          else
            echo "No changed blog URLs to notify."
          fi
