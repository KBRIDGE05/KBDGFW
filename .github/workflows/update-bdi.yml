name: Update BDI weekly

on:
  workflow_dispatch:
  schedule:
    # Saturday 09:10 KST plus 13:10 KST retry for delayed public quote pages.
    - cron: "10 0 * * 6"
    - cron: "10 4 * * 6"

permissions:
  contents: write

concurrency:
  group: freight-data-writer
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Read latest public BDI close
        run: python scripts/update_freight_data.py --only bdi
      - name: Commit only when data changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- data/freight-data.json; then
            echo "No new weekly BDI value or source-status change."
            exit 0
          fi
          git config user.name "kbridge-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/freight-data.json
          git commit -m "data: update BDI"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
