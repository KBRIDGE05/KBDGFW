name: Update BDI weekly

on:
  workflow_dispatch:
  schedule:
    # Saturday 09:10 KST = Saturday 00:10 UTC.
    # This captures the latest published Baltic Exchange business-day close,
    # normally Friday's observation.
    - cron: "10 0 * * 6"

permissions:
  contents: write

concurrency:
  group: update-bdi
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Read latest public BDI close
        run: python scripts/update_freight_data.py --only bdi
      - name: Commit only when data changed
        shell: bash
        run: |
          if git diff --quiet -- data/freight-data.json; then
            echo "No new weekly BDI value published."
            exit 0
          fi
          git config user.name "kbridge-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/freight-data.json
          git commit -m "data: update BDI"
          git push
